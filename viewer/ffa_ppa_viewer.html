<style>
  :root { --bg:#f6f6f7; --panel:#ffffff; --ink:#222; --muted:#666; --line:#ddd; --accent:#1f78b4; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color:var(--ink); background:var(--bg); }
  .app { display:grid; grid-template-columns:320px 1fr; height:100vh; }
  .side { padding:14px 16px; overflow-y:auto; background:var(--panel); border-right:1px solid var(--line); }
  .main { position:relative; }
  #plot { width:100%; height:100%; }
  h1 { font-size:16px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:12px; margin-bottom:12px; }
  fieldset { border:1px solid var(--line); border-radius:8px; margin:0 0 12px; padding:8px 10px 10px; }
  legend { font-weight:600; font-size:12px; color:var(--muted); padding:0 4px; }
  label.row { display:grid; grid-template-columns:1fr 60px; align-items:center; gap:8px; margin:6px 0; }
  label.row span.val { color:var(--muted); font-variant-numeric:tabular-nums; text-align:right; font-size:12px; }
  input[type=range] { width:100%; }
  .chk { display:flex; align-items:center; gap:6px; margin:4px 0; }
  .chk input[type=color] { width:28px; height:22px; border:none; padding:0; background:none; margin-left:auto; }
  .btns { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  button { font:inherit; font-size:12px; padding:5px 9px; border:1px solid var(--line); border-radius:6px; background:#fafafa; cursor:pointer; }
  button:hover { background:#f0f0f0; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  textarea { width:100%; height:64px; font:11px/1.3 ui-monospace,Menlo,monospace; border:1px solid var(--line); border-radius:6px; padding:6px; resize:vertical; }
  select, input[type=number] { font:inherit; font-size:12px; padding:3px 4px; border:1px solid var(--line); border-radius:6px; background:#fff; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:6px 10px; align-items:center; }
  #progress { font-size:12px; color:var(--muted); margin-top:6px; min-height:16px; }
  #dl a { color:var(--accent); font-weight:600; }
  .peaks { font-size:11px; color:var(--muted); margin-top:6px; }
  @media (max-width:800px) { .app { grid-template-columns:1fr; grid-template-rows:auto 1fr; height:auto; } .main { height:70vh; } }
</style>
</head>
<body>
<div class="app">
  <div class="side">
    <h1>FFA / PPA 3D viewer</h1>
    <div class="sub">Neurosynth meta-analytic maps (CC0) inside a translucent fsaverage cortex. Drag to rotate, scroll to zoom, shift-drag to pan.</div>

    <fieldset><legend>Regions</legend>
      <div class="chk"><input type="checkbox" id="show_FFA" checked><label for="show_FFA">FFA</label><input type="color" id="col_FFA"></div>
      <div class="chk"><input type="checkbox" id="show_FFA_ctx"><label for="show_FFA_ctx">FFA map: other clusters</label><input type="color" id="col_FFA_ctx"></div>
      <div class="chk"><input type="checkbox" id="show_PPA" checked><label for="show_PPA">PPA</label><input type="color" id="col_PPA"></div>
      <div class="chk"><input type="checkbox" id="show_PPA_ctx"><label for="show_PPA_ctx">PPA map: other clusters</label><input type="color" id="col_PPA_ctx"></div>
      <label class="row"><span>Region opacity</span><span class="val" id="v_reg">1.00</span></label><input type="range" id="op_reg" min="0.05" max="1" step="0.05" value="1">
      <label class="row"><span>Other-cluster opacity</span><span class="val" id="v_ctx">0.35</span></label><input type="range" id="op_ctx" min="0.05" max="1" step="0.05" value="0.35">
      <div class="peaks" id="peaks"></div>
    </fieldset>

    <fieldset><legend>Glass brain</legend>
      <div class="chk"><input type="checkbox" id="show_glass" checked><label for="show_glass">Show cortex</label><input type="color" id="col_glass" value="#9aa0a6"></div>
      <label class="row"><span>Cortex opacity</span><span class="val" id="v_glass">0.10</span></label><input type="range" id="op_glass" min="0.02" max="1" step="0.02" value="0.10">
      <div class="chk"><input type="checkbox" id="show_labels" checked><label for="show_labels">L / R labels</label></div>
      <div class="chk"><label for="bg">Background</label><select id="bg" style="margin-left:auto"><option value="#ffffff">white</option><option value="#000000">black</option><option value="#f6f6f7">light grey</option></select></div>
    </fieldset>

    <fieldset><legend>Camera</legend>
      <div class="btns">
        <button data-view="ventral">ventral</button><button data-view="dorsal">dorsal</button>
        <button data-view="left">left</button><button data-view="right">right</button>
        <button data-view="anterior">anterior</button><button data-view="posterior">posterior</button>
        <button data-view="oblique">oblique</button>
      </div>
      <div class="btns"><button id="copycam">Copy camera JSON</button><button id="savepng">Save PNG of this view</button></div>
      <textarea id="cam" readonly placeholder="current camera appears here after you rotate"></textarea>
    </fieldset>

    <fieldset><legend>Turntable GIF</legend>
      <div class="grid2">
        <label for="axis">Spin axis</label><select id="axis"><option value="z">vertical (z)</option><option value="y">front-back (y)</option><option value="x">left-right (x)</option></select>
        <label for="elev">Elevation</label><input type="range" id="elev" min="-1.5" max="1.5" step="0.1" value="-0.9">
        <label for="radius">Distance</label><input type="range" id="radius" min="1.0" max="3.0" step="0.05" value="1.75">
        <label for="nframes">Frames</label><input type="number" id="nframes" value="36" min="8" max="180">
        <label for="delay">Frame delay (ms)</label><input type="number" id="delay" value="80" min="20" max="500">
        <label for="gw">Width × height</label><div><input type="number" id="gw" value="720" min="200" max="2000" style="width:70px"> × <input type="number" id="gh" value="576" min="200" max="2000" style="width:70px"></div>
      </div>
      <div class="btns"><button id="preview">Preview orbit</button><button id="record" class="primary">Record GIF</button><button id="stop" disabled>Stop</button></div>
      <div id="progress"></div><div id="dl"></div>
    </fieldset>
  </div>
  <div class="main"><div id="plot"></div></div>
</div>

<script>
const D = window.BRAIN_DATA;
const gd = document.getElementById('plot');
const $ = id => document.getElementById(id);
const LIGHT_GLASS = {ambient:0.7, diffuse:0.5, specular:0.05};
const LIGHT_REG = {ambient:0.45, diffuse:0.85, specular:0.35, roughness:0.4, fresnel:0.1};

function mesh(m, extra) {
  const v = m.v, f = m.f;
  return Object.assign({type:'mesh3d', x:v.map(p=>p[0]), y:v.map(p=>p[1]), z:v.map(p=>p[2]),
    i:f.map(t=>t[0]), j:f.map(t=>t[1]), k:f.map(t=>t[2]), hoverinfo:'skip', flatshading:false}, extra);

// trace order: 0 glass L, 1 glass R, 2 labels, then regions
const traces = [
  mesh(D.glass.left,  {name:'cortex L', color:'#9aa0a6', opacity:0.10, lighting:LIGHT_GLASS}),
  mesh(D.glass.right, {name:'cortex R', color:'#9aa0a6', opacity:0.10, lighting:LIGHT_GLASS}),
  {type:'scatter3d', mode:'text', x:[-78,78], y:[-20,-20], z:[-45,-45], text:['L','R'], textfont:{size:22, color:'#333'}, hoverinfo:'skip', name:'labels'},
];
const idx = {};
for (const [name, r] of Object.entries(D.regions)) {
  idx[name] = traces.length; traces.push(mesh(r.main, {name, color:r.color, opacity:1, lighting:LIGHT_REG}));
  $('col_'+name).value = r.color;
  if (r.ctx) { idx[name+'_ctx'] = traces.length; traces.push(mesh(r.ctx, {name:name+' other clusters', color:r.ctx_color, opacity:0.35, visible:false})); }
  $('col_'+name+'_ctx').value = r.ctx_color;
  if (!r.ctx) $('show_'+name+'_ctx').disabled = true;
}
const VIEWS = {
  ventral:  {eye:{x:0, y:-0.35, z:-1.9}, up:{x:0,y:1,z:0}},
  dorsal:   {eye:{x:0, y:-0.35, z:1.9},  up:{x:0,y:1,z:0}},
  left:     {eye:{x:-1.9, y:0, z:0},     up:{x:0,y:0,z:1}},
  right:    {eye:{x:1.9, y:0, z:0},      up:{x:0,y:0,z:1}},
  anterior: {eye:{x:0, y:1.9, z:0},      up:{x:0,y:0,z:1}},
  posterior:{eye:{x:0, y:-1.9, z:0},     up:{x:0,y:0,z:1}},
  oblique:  {eye:{x:1.4, y:-1.1, z:-1.1}, up:{x:0,y:0,z:1}},
};
const layout = {
  paper_bgcolor:'#ffffff', margin:{l:0,r:0,t:0,b:0}, showlegend:false,
  scene:{xaxis:{visible:false}, yaxis:{visible:false}, zaxis:{visible:false}, aspectmode:'data',
         camera:Object.assign({center:{x:0,y:0,z:0}}, VIEWS.ventral), bgcolor:'#ffffff'},
};
Plotly.newPlot(gd, traces, layout, {responsive:true, displaylogo:false, modeBarButtonsToRemove:['toImage']});

// peaks
$('peaks').innerHTML = Object.entries(D.peaks).map(([n, rows]) => n + ': ' + rows.map(r => `${r.hemi} (${r.peak_x}, ${r.peak_y}, ${r.peak_z}) z=${r.peak_z_score}`).join('; ')).join('<br>');

// controls
function bindOpacity(slider, valEl, traceIdxs) {
  $(slider).addEventListener('input', e => { const v = +e.target.value; $(valEl).textContent = v.toFixed(2); Plotly.restyle(gd, {opacity:v}, traceIdxs()); });
}
bindOpacity('op_glass', 'v_glass', () => [0,1]);
bindOpacity('op_reg', 'v_reg', () => Object.keys(D.regions).map(n => idx[n]));
bindOpacity('op_ctx', 'v_ctx', () => Object.keys(D.regions).filter(n => idx[n+'_ctx'] !== undefined).map(n => idx[n+'_ctx']));
$('show_glass').addEventListener('change', e => Plotly.restyle(gd, {visible:e.target.checked}, [0,1]));
$('show_labels').addEventListener('change', e => Plotly.restyle(gd, {visible:e.target.checked}, [2]));
$('col_glass').addEventListener('input', e => Plotly.restyle(gd, {color:e.target.value}, [0,1]));
for (const name of Object.keys(D.regions)) {
  $('show_'+name).addEventListener('change', e => Plotly.restyle(gd, {visible:e.target.checked}, [idx[name]]));
  $('col_'+name).addEventListener('input', e => Plotly.restyle(gd, {color:e.target.value}, [idx[name]]));
  if (idx[name+'_ctx'] !== undefined) {
    $('show_'+name+'_ctx').addEventListener('change', e => Plotly.restyle(gd, {visible:e.target.checked}, [idx[name+'_ctx']]));
    $('col_'+name+'_ctx').addEventListener('input', e => Plotly.restyle(gd, {color:e.target.value}, [idx[name+'_ctx']]));
  }
}
$('bg').addEventListener('change', e => {
  const c = e.target.value, dark = c === '#000000';
  Plotly.relayout(gd, {paper_bgcolor:c, 'scene.bgcolor':c});
  Plotly.restyle(gd, {'textfont.color': dark ? '#ddd' : '#333'}, [2]);
});
document.querySelectorAll('button[data-view]').forEach(b => b.addEventListener('click', () => Plotly.relayout(gd, {'scene.camera':Object.assign({center:{x:0,y:0,z:0}}, VIEWS[b.dataset.view])})));

function camJSON() { const c = gd._fullLayout.scene.camera; return JSON.stringify({eye:c.eye, up:c.up, center:c.center}); }
gd.on('plotly_relayout', () => { $('cam').value = camJSON(); });
$('copycam').addEventListener('click', async () => { $('cam').value = camJSON(); try { await navigator.clipboard.writeText($('cam').value); } catch(e) {} });
$('savepng').addEventListener('click', () => Plotly.downloadImage(gd, {format:'png', width:1600, height:1280, scale:1, filename:'ffa_ppa_view'}));

// turntable
let stopFlag = false;
function orbitCamera(i, n) {
  const axis = $('axis').value, r = +$('radius').value, e = +$('elev').value;
  const th = -Math.PI/2 + 2*Math.PI*i/n, c = Math.cos(th), s = Math.sin(th);
  let eye, up;
  if (axis === 'z')      { eye = {x:r*c, y:r*s, z:e};  up = {x:0,y:0,z:1}; }
  else if (axis === 'y') { eye = {x:r*c, y:e, z:r*s};  up = {x:0,y:1,z:0}; }
  else                   { eye = {x:e, y:r*c, z:r*s};  up = {x:1,y:0,z:0}; }
  return {eye, up, center:{x:0,y:0,z:0}};
}
async function runOrbit(record) {
  const n = Math.max(8, +$('nframes').value|0), w = +$('gw').value|0, h = +$('gh').value|0, delay = +$('delay').value|0;
  stopFlag = false; $('stop').disabled = false; $('record').disabled = true; $('preview').disabled = true; $('dl').innerHTML = '';
  const saved = camJSON();
  let gif, canvas, ctx;
  if (record) { gif = window.gifenc.GIFEncoder(); canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h; ctx = canvas.getContext('2d', {willReadFrequently:true}); }
  for (let i = 0; i < n && !stopFlag; i++) {
    await Plotly.relayout(gd, {'scene.camera': orbitCamera(i, n)});
    if (record) {
      const url = await Plotly.toImage(gd, {format:'png', width:w, height:h, scale:1});
      const img = new Image(); await new Promise(res => { img.onload = res; img.src = url; });
      ctx.fillStyle = $('bg').value; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);

      const palette = window.gifenc.quantize(rgba, 256);
      const index = window.gifenc.applyPalette(rgba, palette);

    } else {
      $('progress').textContent = `frame ${i+1} / ${n}`; await new Promise(res => setTimeout(res, delay));
    }

    gif.finish();
    const blob = new Blob([gif.bytes()], {type:'image/gif'}); const url = URL.createObjectURL(blob);
    $('dl').innerHTML = `<a href="${url}" download="ffa_ppa_turntable.gif">Download GIF (${(blob.size/1e6).toFixed(1)} MB)</a>`;
    $('progress').textContent = 'done';
  } else if (stopFlag) { $('progress').textContent = 'stopped'; }
  await Plotly.relayout(gd, {'scene.camera': JSON.parse(saved)});
  $('stop').disabled = true; $('record').disabled = false; $('preview').disabled = false;
}
$('preview').addEventListener('click', () => runOrbit(false));
$('record').addEventListener('click', () => runOrbit(true));
$('stop').addEventListener('click', () => { stopFlag = true; });
</script>
